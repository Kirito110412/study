[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asta"
version = "0.1.0"
description = "ASTA: Advanced Sentient Task Architecture"
authors = [
    { name = "ASTA Creator", email = "creator@asta.local" }
]
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.2",
    "docker>=7.0.0",
    "jinja2>=3.1.0",
    "mss>=9.0.1",
    "PyAutoGUI>=0.9.54",
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
